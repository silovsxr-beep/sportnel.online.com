<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPORTNEL — NHL Live Streams</title>
<style>
:root {--bg-body:#080a10;--bg-card:#111522;--accent-nhl:#0070f3;--accent-live:#e50914;--text-main:#ffffff;--text-grey:#858fa3;--border-line:#1d2438;}
* {box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;}
body {background-color:var(--bg-body);color:var(--text-main);padding:15px;display:flex;flex-direction:column;align-items:center;min-height:100vh;}
.container {width:100%;max-width:650px;flex-grow:1;}
header {background-color:var(--bg-card);border:1px solid var(--border-line);padding:16px 20px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;}
.brand {font-size:20px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;}
.brand span {color:var(--accent-nhl);}
.social-links {display:flex;align-items:center;gap:18px;}
.social-icon {display:flex;align-items:center;justify-content:center;text-decoration:none;transition:transform 0.2s;}
.social-icon:hover {transform:scale(1.15);}
/* Точные размеры для цветной встроенной графики */
.social-icon svg {width:28px;height:28px;display:block;}
.player-wrapper {background-color:var(--bg-card);border:1px solid var(--border-line);border-radius:16px;padding:12px;margin-bottom:25px;}
.video-ratio {position:relative;padding-bottom:56.25%;height:0;overflow:hidden;background-color:#020305;border-radius:10px;}
.video-ratio iframe {position:absolute;top:0;left:0;width:100%;height:100%;border:none;}
.player-cover {position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;color:var(--text-grey);gap:12px;font-size:13px;background:linear-gradient(135deg,#0d111f 0%,#05070d 100%);z-index:10;text-align:center;padding:20px;}
.player-cover svg {width:52px;height:52px;fill:var(--accent-nhl);margin-bottom:5px;}
.grid-header {font-size:13px;font-weight:800;text-transform:uppercase;color:var(--text-grey);margin:0 0 12px 5px;letter-spacing:1px;}
.match-list {display:flex;flex-direction:column;gap:10px;}
.match-row {background-color:var(--bg-card);border:1px solid var(--border-line);border-radius:12px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;}
.teams-title {font-size:15px;font-weight:700;color:var(--text-main);}
.match-status {font-size:12px;color:var(--text-grey);display:flex;align-items:center;gap:6px;}
.match-status .live-dot {color:var(--accent-live);font-weight:800;animation:blinker 1.5s linear infinite;}
@keyframes blinker {50% {opacity:0;}}
.btn-stream {background-color:var(--accent-live);color:var(--text-main);border:none;padding:10px 18px;border-radius:8px;font-size:11px;font-weight:800;text-transform:uppercase;cursor:pointer;}
footer {margin-top:40px;padding:20px 10px;text-align:center;border-top:1px solid var(--border-line);width:100%;max-width:650px;}
.footer-text {font-size:13px;color:var(--text-grey);letter-spacing:0.8px;font-weight:600;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px;}
.footer-text svg {width:16px;height:16px;fill:var(--accent-nhl);}
</style>
</head>
<body>
<div class="container">
<header>
<div class="brand">SPORT<span>NEL</span></div>
<div class="social-links">
<!-- Встроенный оригинальный 3D TikTok со свечением из твоего фото -->
<a href="#" class="social-icon tt" target="_blank">
<svg viewBox="0 0 24 24">
<path d="M12.4 21.2c-3.7 0-6.7-3-6.7-6.7 0-3.5 2.9-6.4 6.4-6.6v2c-2.4.2-4.3 2.2-4.3 4.6 0 2.6 2.1 4.7 4.7 4.7 2.3 0 4.2-1.6 4.6-3.8h2c-.4 3.3-3.4 5.8-6.7 5.8z" fill="#00f2fe"/>
<path d="M13.1 19.3c-2.6 0-4.7-2.1-4.7-4.7 0-2.4 1.9-4.4 4.3-4.6v-2c-3.5.2-6.4 3.1-6.4 6.6 0 3.7 3 6.7 6.7 6.7 3.3 0 6.3-2.5 6.7-5.8h-2c-.4 2.2-2.3 3.8-4.6 3.8z" fill="#fe0943"/>
<path d="M12.7 5.1v10.5c0 1.9-1.5 3.4-3.4 3.4S5.9 17.5 5.9 15.6s1.5-3.4 3.4-3.4c.3 0 .7.1 1 .2V10.3c-.3-.1-.7-.1-1-.1-3.6 0-6.5 2.9-6.5 6.5s2.9 6.5 6.5 6.5 6.5-2.9 6.5-6.5V7.4c1.3.9 2.9 1.4 4.6 1.4V6.7c-1.6 0-3.1-.7-4.1-1.6z" fill="#FFFFFF"/>
</svg>
</a>
<!-- Встроенная оригинальная красная кнопка YouTube из твоего фото -->
<a href="#" class="social-icon yt" target="_blank">
<svg viewBox="0 0 24 24">
<path d="M23.498 6.163a3.003 3.003 0 0 0-2.11-2.11C19.517 3.545 12 3.545 12 3.545s-7.516 0-9.388.508a3.003 3.003 0 0 0-2.11 2.11C0 8.033 0 12 0 12s0 3.967.502 5.837a3.003 3.003 0 0 0 2.11 2.11c1.872.507 9.388.507 9.388.507s7.517 0 9.389-.507a3.003 3.003 0 0 0 2.11-2.11C24 15.967 24 12 24 12s0-3.967-.502-5.837z" fill="#FF0000"/>
<polygon points="9.545,15.568 15.818,12 9.545,8.432" fill="#FFFFFF"/>
</svg>
</a>
</div>
</header>
<div class="player-wrapper">
<div class="video-ratio">
<div class="player-cover" id="screenCover">
<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
<p>Выберите интересующий матч из расписания ниже</p>
</div>
<iframe id="nhlStreamIframe" src="" allow="autoplay; fullscreen" allowfullscreen style="display:none;"></iframe>
</div>
</div>
<div class="grid-header">МАТЧИ СЕГОДНЯ (ЛАТВИЙСКОЕ ВРЕМЯ)</div>
<div class="match-list">
<div class="match-row">
<div class="teams-block">
<div class="teams-title">Vancouver — Florida</div>
<div class="match-status"><span class="live-dot">●</span> 02:00 · NHL Регулярный сезон</div>
</div>
<button class="btn-stream" onclick="loadNhlStream('https://media-player.host')">Смотреть</button>
</div>
</div>
</div>
<footer>
<div class="footer-text">
<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 3.8 2 6v12c0 2.2 4.48 4 10 4s10-1.8 10-4V6c0-2.2-4.48-4-10-4zm0 2c4.83 0 8.57 1.41 8.95 2-.38.59-4.12 2-8.95 2S3.43 6.59 3.05 6c.38-.59 4.12-2 8.95-2zm0 14c-4.97 0-9-1.57-9-3.5V10.1c1.42 1.15 4.88 1.9 9 1.9s7.58-.75 9-1.9v4.4c0 1.93-4.03 3.5-9 3.5z"/></svg>
The best website for watching NHL live streams
</div>
</footer>
<script>
function loadNhlStream(streamUrl) {
const cover = document.getElementById('screenCover');
const iframe = document.getElementById('nhlStreamIframe');
if(streamUrl && streamUrl !== '#') {
cover.style.display = 'none';
iframe.style.display = 'block';
iframe.src = streamUrl;
}
}
</script>
</body>
</html>
