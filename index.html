<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPORTNEL — Прямые трансляции матчей NHL</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg-body: #080a10;
            --bg-card: #111522;
            --accent-nhl: #0070f3;
            --accent-live: #e50914;
            --text-main: #ffffff;
            --text-grey: #858fa3;
            --border-line: #1d2438;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        header {
            background-color: var(--bg-card);
            border: 1px solid var(--border-line);
            padding: 16px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4);
        }

        .brand {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .brand span {
            color: var(--accent-nhl);
        }

        .nhl-badge {
            background: rgba(0, 112, 243, 0.1);
            color: var(--accent-nhl);
            border: 1px solid rgba(0, 112, 243, 0.25);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .player-wrapper {
            background-color: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 25px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6);
        }

        .video-ratio {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            background-color: #020305;
            border-radius: 10px;
        }

        .video-ratio iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-grey);
            gap: 12px;
            font-size: 13px;
            background: linear-gradient(135deg, #0d111f 0%, #05070d 100%);
            z-index: 10;
            text-align: center;
            padding: 20px;
            font-weight: 500;
        }

        .player-cover i {
            font-size: 52px;
            color: var(--accent-nhl);
        }

        .grid-header {
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-grey);
            margin: 0 0 12px 5px;
            letter-spacing: 1px;
        }

        .match-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .match-row {
            background-color: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .teams-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .teams-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
        }

        .match-status {
            font-size: 12px;
            color: var(--text-grey);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .match-status .live-dot {
            color: var(--accent-live);
            font-weight: 800;
            animation: blinker 1.5s linear infinite;
        }

        @keyframes blinker { 50% { opacity: 0; } }

        .btn-stream {
            background-color: var(--accent-live);
            color: var(--text-main);
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.3);
        }

        .btn-stream.disabled {
            background-color: #171c2b;
            border: 1px solid var(--border-line);
            color: var(--text-grey);
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="brand">SPORT<span>NEL</span></div>
            <div class="nhl-badge"><i class="fa-solid fa-puck"></i> NHL LIVE</div>
        </header>

        <div class="player-wrapper">
            <div class="video-ratio">
                <div class="player-cover" id="screenCover">
                    <i class="fa-solid fa-circle-play"></i>
                    <p>Выберите интересующий матч из расписания ниже</p>
                </div>
                <iframe id="nhlStreamIframe" src="" allowfullscreen style="display:none;"></iframe>
            </div>
        </div>

        <div class="grid-header">Расписание трансляций</div>
        
        <div class="match-list">
            <div class="match-row">
                <div class="teams-block">
                    <div class="teams-title">Вашингтон Кэпиталз — Нью-Джерси Девилз</div>
                    <div class="match-status"><span class="live-dot">● LIVE</span> · Регулярный сезон NHL</div>
                </div>
                <!-- Отредактированная прямая ссылка на видеопоток CDN без родительского сайта -->
                <button class="btn-stream" onclick="loadNhlStream('https://videocdn-4727.website')">Смотреть</button>
            </div>

            <div class="match-row">
                <div class="teams-block">
                    <div class="teams-title">Нью-Йорк Рейнджерс — Коламбус Блю Джекетс</div>
                    <div class="match-status">Сегодня, 23:55 · Регулярный сезон</div>
                </div>
                <button class="btn-stream disabled" onclick="alert('Ожидание матча!')">Ожидание</button>
            </div>
        </div>
    </div>

    <script>
        function loadNhlStream(streamUrl) {
            const cover = document.getElementById('screenCover');
            const iframe = document.getElementById('nhlStreamIframe');
            
            if(streamUrl) {
                cover.style.display = 'none';
                iframe.style.display = 'block';
                iframe.src = streamUrl;
            }
        }
    </script>
</body>
</html>
