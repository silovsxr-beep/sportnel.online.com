<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPORTNEL — NHL Live Streams</title>
<style>
:root {--bg-body:#05070c;--bg-card:#0e111a;--accent-nhl:#0070f3;--accent-live:#e50914;--text-main:#ffffff;--text-grey:#858fa3;--border-line:#1a1f2c;}
* {box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;}
body {background-color:var(--bg-body);color:var(--text-main);padding:15px;display:flex;flex-direction:column;align-items:center;min-height:100vh;}
.container {width:100%;max-width:650px;flex-grow:1;}
header {
    background-color:var(--bg-card);border:1px solid var(--border-line);border-bottom:2px solid var(--accent-nhl);padding:16px 20px;border-radius:14px;
    display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;box-shadow:0 4px 25px rgba(0,112,243,0.25);
}
.brand {font-size:20px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;}
.brand span {color:var(--accent-nhl);}
.social-links {display:flex;align-items:center;gap:18px;}
.social-icon {display:flex;align-items:center;justify-content:center;text-decoration:none;transition:transform 0.2s;}
.social-icon:hover {transform:scale(1.15);}
.social-icon svg {width:24px;height:24px;display:block;}
.player-wrapper {
    background-color:var(--bg-card);border:1px solid var(--border-line);border-radius:18px;padding:12px;margin-bottom:25px;position:relative;
    box-shadow:0 0 20px rgba(0,112,243,0.15);animation:neonBorder 6s linear infinite;
}
@keyframes neonBorder {
    0% {border-color:var(--accent-nhl);box-shadow:0 0 25px rgba(0,112,243,0.25);}
    50% {border-color:var(--accent-live);box-shadow:0 0 25px rgba(229,9,20,0.25);}
    100% {border-color:var(--accent-nhl);box-shadow:0 0 25px rgba(0,112,243,0.25);}
}
.video-ratio {position:relative;padding-bottom:56.25%;height:0;overflow:hidden;background-color:#010204;border-radius:12px;}
.video-ratio iframe {position:absolute;top:0;left:0;width:100%;height:100%;border:none;}
.player-cover {position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;color:var(--text-grey);gap:12px;font-size:13px;background:linear-gradient(135deg,#0b0e1a 0%,#030408 100%);z-index:10;text-align:center;padding:20px;}
.player-cover svg {width:55px;height:55px;fill:var(--accent-nhl);margin-bottom:5px;animation:pulsePlay 2s ease-in-out infinite;}
@keyframes pulsePlay {
    0% {transform:scale(1);filter:drop-shadow(0 0 5px rgba(0,112,243,0.3));}
    50% {transform:scale(1.06);filter:drop-shadow(0 0 15px rgba(0,112,243,0.7));}
    100% {transform:scale(1);filter:drop-shadow(0 0 5px rgba(0,112,243,0.3));}
}
.grid-header {font-size:12px;font-weight:800;text-transform:uppercase;color:var(--text-grey);margin:0 0 12px 5px;letter-spacing:1.5px;}
.match-list {display:flex;flex-direction:column;gap:12px;}
.match-row {
    background-color:var(--bg-card);border:1px solid var(--border-line);border-bottom:3px solid var(--accent-nhl);border-radius:16px;
    padding:18px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 25px rgba(0,112,243,0.15);
}
.teams-block {display:flex;flex-direction:column;gap:8px;}
.team-item {display:flex;align-items:center;gap:12px;}
.team-logo-svg {width:24px;height:24px;display:block;}
.teams-title {font-size:16px;font-weight:700;color:var(--text-main);letter-spacing:0.3px;}
.match-status {font-size:12px;color:var(--text-grey);display:flex;align-items:center;gap:6px;margin-top:2px;font-weight:500;}
.match-status .live-dot {color:var(--accent-live);font-weight:900;animation:blinker 1.5s linear infinite;}
@keyframes blinker {50% {opacity:0;}}
.btn-stream {
    background:linear-gradient(135deg,var(--accent-live) 0%,#b8070f 100%);color:var(--text-main);border:none;padding:11px 22px;
    border-radius:10px;font-size:11px;font-weight:800;text-transform:uppercase;cursor:pointer;letter-spacing:0.8px;
    transition:transform 0.2s,box-shadow 0.2s;box-shadow:0 4px 15px rgba(229, 9, 20, 0.4);
}
.btn-stream:hover {transform:translateY(-1px);box-shadow:0 6px 20px rgba(229, 9, 20, 0.6);}
<footer>
<div class="footer-text">
<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 3.8 2 6v12c0 2.2 4.48 4 10 4s10-1.8 10-4V6c0-2.2-4.48-4-10-4zm0 2c4.83 0 8.57 1.41 8.95 2-.38.59-4.12 2-8.95 2S3.43 6.59 3.05 6c.38-.59 4.12-2 8.95-2zm0 14c-4.97 0-9-1.57-9-3.5V10.1c1.42 1.15 4.88 1.9 9 1.9s7.58-.75 9-1.9v4.4c0 1.93-4.03 3.5-9 3.5z" fill="#45f3ff" style="filter: drop-shadow(0 0 8px rgba(69,243,255,0.8)); animation: spinPuck 4s linear infinite;"/></svg>
<span class="neon-blue" style="color: #45f3ff; text-shadow: 0 0 10px rgba(69, 243, 255, 0.8), 0 0 20px rgba(69, 243, 255, 0.4);">The best website</span> 
<span class="neon-red" style="color: #ff2a3b; text-shadow: 0 0 10px rgba(255, 42, 59, 0.8), 0 0 20px rgba(255, 42, 59, 0.4);">for watching NHL live streams</span>
</div>
</footer>
<script>
function loadNhlStream(streamUrl) {
    const cover = document.getElementById('screenCover');
    const iframe = document.getElementById('nhlStreamIframe');
    if(streamUrl && streamUrl !== '#') {
        cover.style.display = 'none';
        iframe.style.display = 'block';
        iframe.src = streamUrl;
    }
}
</script>
<style>@keyframes spinPuck {100% {transform:rotate(360deg);}}</style>
</body>
</html>
