<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPORTNEL — NHL Live Streams</title>
<style>
:root {--bg-body:#05070c;--bg-card:#0e111a;--accent-nhl:#0070f3;--accent-live:#e50914;--text-main:#ffffff;--text-grey:#858fa3;--border-line:#1a1f2c;}
* {box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;}
body {background-color:var(--bg-body);color:var(--text-main);padding:15px;display:flex;flex-direction:column;align-items:center;min-height:100vh;}
.container {width:100%;max-width:650px;flex-grow:1;}

header {
    background-color:var(--bg-card);
    border: 1px solid var(--border-line);
    border-bottom: 2px solid var(--accent-nhl);
    padding: 16px 20px;
    border-radius: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    box-shadow: 0 4px 25px rgba(0, 112, 243, 0.25);
}
.brand {font-size:20px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;}
.brand span {color:var(--accent-nhl);}
.social-links {display:flex;align-items:center;gap:18px;}
.social-icon {display:flex;align-items:center;justify-content:center;text-decoration:none;transition:transform 0.2s;}
.social-icon:hover {transform:scale(1.15);}
.social-icon svg {width:24px;height:24px;display:block;}

.player-wrapper {
    background-color:var(--bg-card);
    border:1px solid var(--border-line);
    border-radius:18px;
    padding:12px;
    margin-bottom:25px;
    position:relative;
    box-shadow: 0 0 20px rgba(0, 112, 243, 0.15);
    animation: neonBorder 6s linear infinite;
}
@keyframes neonBorder {
    0% { border-color: var(--accent-nhl); box-shadow: 0 0 25px rgba(0, 112, 243, 0.25); }
    50% { border-color: var(--accent-live); box-shadow: 0 0 25px rgba(229, 9, 20, 0.25); }
    100% { border-color: var(--accent-nhl); box-shadow: 0 0 25px rgba(0, 112, 243, 0.25); }
}
.video-ratio {position:relative;padding-bottom:56.25%;height:0;overflow:hidden;background-color:#010204;border-radius:12px;}
.video-ratio iframe {position:absolute;top:0;left:0;width:100%;height:100%;border:none;}
.player-cover {position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;color:var(--text-grey);gap:12px;font-size:13px;background:linear-gradient(135deg,#0b0e1a 0%,#030408 100%);z-index:10;text-align:center;padding:20px;}
.player-cover svg {width:55px;height:55px;fill:var(--accent-nhl);margin-bottom:5px;animation: pulsePlay 2s ease-in-out infinite;}
@keyframes pulsePlay {
    0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(0,112,243,0.3)); }
    50% { transform: scale(1.06); filter: drop-shadow(0 0 15px rgba(0,112,243,0.7)); }
    100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(0,112,243,0.3)); }
}

.grid-header {font-size:12px;font-weight:800;text-transform:uppercase;color:var(--text-grey);margin:0 0 12px 5px;letter-spacing:1.5px;}

.match-row {
    background-color:var(--bg-card);
    border:1px solid var(--border-line);
    border-radius: 16px;
    padding: 6px;
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

/* 1. Нажимаемая синяя кнопка-карточка слева */
.teams-btn-clickable {
    background: none;
    border: none;
    border-bottom: 3px solid var(--accent-nhl);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    text-align: left;
    cursor: pointer;
    flex-grow: 1;
    transition: background 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 15px rgba(0, 112, 243, 0.1);
}
.teams-btn-clickable:hover {
    background-color: #121624;
    box-shadow: 0 6px 20px rgba(0, 112, 243, 0.25);
}
.teams-btn-clickable:active { transform: scale(0.99); }

.team-item {display:flex;align-items:center;gap:10px;}

/* 3. Простые и надежные новые значки хоккея (клюшки и шайба) */
.hockey-icon {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.hockey-icon svg { width: 100%; height: 100%; }

.teams-title {font-size:15px;font-weight:700;color:var(--text-main);letter-spacing:0.3px;}
.match-status {font-size:12px;color:var(--text-grey);display:flex;align-items:center;gap:6px;font-weight:500;}
.match-status .live-dot {color:var(--accent-live);font-weight:900;animation:blinker 1.5s linear infinite;}
@keyframes blinker {50% {opacity:0;}}

.right-action-block {
    display: flex;
    align-items: center;
    padding: 0 10px 0 14px;
}

.btn-stream {
    background: linear-gradient(135deg, var(--accent-live) 0%, #b8070f 100%);
    color:var(--text-main);
    border:none;
    padding:12px 20px;
    border-radius:10px;
    font-size:11px;
    font-weight:800;
    text-transform: uppercase;
    cursor:pointer;
    letter-spacing:0.8px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
}
.btn-stream:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(229, 9, 20, 0.6); }

footer {
    margin-top: auto;
    padding: 25px 10px;
    text-align: center;
    border-top: 1px solid var(--border-line);
    width: 100%;
    max-width: 650px;
}

/* 2. Текст внизу с раздельным сине-красным неоновым свечением */
.footer-text {
    font-size:12px;
    letter-spacing:1px;
    font-weight:700;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
}
.neon-blue-txt {
    color: #45f3ff;
    text-shadow: 0 0 12px rgba(69, 243, 255, 0.6);
}
.neon-red-txt {
    color: var(--accent-live);
    text-shadow: 0 0 12px rgba(229, 9, 20, 0.6);
}
</style>
</head>
<body>
<div class="container">
<header>
<div class="brand">SPORT<span>NEL</span></div>
<div class="social-links">
<a href="https://tiktok.com" class="social-icon tt" target="_blank"><svg viewBox="0 0 24 24"><path d="M16.4 5.9c-1.3-.9-2.2-2.3-2.4-4h-2.1v13.5c0 1.9-1.5 3.4-3.4 3.4s-3.4-1.5-3.4-3.4 1.5-3.4 3.4-3.4c.4 0 .7.1 1.1.2V10c-.4-.1-.7-.1-1.1-.1-3.6 0-6.5 2.9-6.5 6.5s2.9 6.5 6.5 6.5 6.5-2.9 6.5-6.5V7.4c1.6.9 3.4 1.4 5.3 1.4V5.9z" fill="#00f2fe"/><path d="M16.1 5.4c-1.3-.9-2.2-2.3-2.4-4h-2.1v13.5c0 1.9-1.5 3.4-3.4 3.4s-3.4-1.5-3.4-3.4 1.5-3.4 3.4-3.4c.4 0 .7.1 1.1.2V9.5c-.4-.1-.7-.1-1.1-.1-3.6 0-6.5 2.9-6.5 6.5s2.9 6.5 6.5 6.5 6.5-2.9 6.5-6.5V6.9c1.6.9 3.4 1.4 5.3 1.4V5.4z" fill="#fe0943"/><path d="M15.8 4.9c-1.3-.9-2.2-2.3-2.4-4h-2.1v13.5c0 1.9-1.5 3.4-3.4 3.4s-3.4-1.5-3.4-3.4 1.5-3.4 3.4-3.4c.4 0 .7.1 1.1.2V9c-.4-.1-.7-.1-1.1-.1-3.6 0-6.5 2.9-6.5 6.5s2.9 6.5 6.5 6.5 6.5-2.9 6.5-6.5V6.4c1.6.9 3.4 1.4 5.3 1.4V4.9z" fill="#FFFFFF"/></svg></a>
<a href="https://youtube.com" class="social-icon yt" target="_blank"><svg viewBox="0 0 24 24"><path d="M23.498 6.163a3.003 3.003 0 0 0-2.11-2.11C19.517 3.545 12 3.545 12 3.545s-7.516 0-9.388.508a3.003 3.003 0 0 0-2.11 2.11C0 8.033 0 12 0 12s0 3.967.502 5.837a3.003 3.003 0 0 0 2.11 2.11c1.872.507 9.388.507 9.388.507s7.517 0 9.389-.507a3.003 3.003 0 0 0 2.11-2.11C24 15.967 24 12 24 12s0-3.967-.502-5.837z" fill="#FF0000"/><polygon points="9.545,15.568 15.818,12 9.545,8.432" fill="#FFFFFF"/></svg></a>
</div>
</header>
<div class="player-wrapper">
<div class="video-ratio">
<div class="player-cover" id="screenCover">
<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
<p>Select the active match from the schedule below</p>
</div>
<iframe id="nhlStreamIframe" src="" allow="autoplay; fullscreen" allowfullscreen style="display:none;"></iframe>
</div>
</div>
<div class="grid-header">TODAY'S SCHEDULE</div>
<div class="match-list">
<div class="match-row">
    
    <!-- Нажимаемая карточка-кнопка слева (запускает трансляцию так же, как красная кнопка) -->
    <button class="teams-btn-clickable" onclick="loadNhlStream('https://media-player.host')">
        <div class="team-item">
            <!-- 3. Вшитые векторные скрещенные клюшки для Ванкувера -->
            <div class="hockey-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="#0070f3" stroke-width="2.5" stroke-linecap="round"><path d="M5 19L17 7M19 5l-2 2M17 7l2 2M4 20c-1 1-1.5 0 0-1.5L6 16M19 5c1-1 2-.5.5.5L16 9"/></svg>
            </div>
            <!-- Вшитые векторные скрещенные клюшки для Флориды -->
            <div class="hockey-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="#e50914" stroke-width="2.5" stroke-linecap="round"><path d="M5 19L17 7M19 5l-2 2M17 7l2 2M4 20c-1 1-1.5 0 0-1.5L6 16M19 5c1-1 2-.5.5.5L16 9"/></svg>
            </div>
            <div class="teams-title">Vancouver Canucks — Florida Panthers</div>
        </div>
        <div class="match-status"><span class="live-dot">●</span> 02:00 AM · NHL Regular Season</div>
    </button>
    
    <div class="right-action-block">
        <button class="btn-stream" onclick="loadNhlStream('https://media-player.host')">Watch Live</button>
    </div>
    
</div>
</div>
</div>
<footer>
<!-- 2. Двойной неоновый текст (Голубой + Красный) -->
<div class="footer-text">
    <span class="neon-blue-txt">The best website</span> 
    <span class="neon-red-txt">for watching NHL live streams</span>
</div>
</footer>
<script>
function loadNhlStream(streamUrl) {
const cover = document.getElementById('screenCover');
const iframe = document.getElementById('nhlStreamIframe');
if(streamUrl && streamUrl !== '#') {
cover.style.display = 'none';
iframe.style.display = 'block';
iframe.src = streamUrl;
}
}
</script>
</body>
</html>
