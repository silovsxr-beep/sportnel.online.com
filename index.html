<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPORTNEL — Спортивные трансляции онлайн</title>
    <!-- Подключаем стильные иконки FontAwesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg-main: #0b0c10;
            --bg-card: #1f2833;
            --accent-red: #fc4445;
            --accent-cyan: #45f3ff;
            --text-white: #ffffff;
            --text-gray: #c5c6c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            padding-bottom: 60px;
        }

        /* Шапка сайта */
        header {
            background: linear-gradient(to bottom, #11141a, #161a24);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222b38;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: var(--text-white);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: var(--accent-red);
        }

        .social-icons a {
            color: var(--text-gray);
            font-size: 20px;
            margin-left: 15px;
            transition: 0.3s;
        }

        .social-icons a:hover {
            color: var(--accent-cyan);
        }

        /* Баннер фрибета */
        .promo-banner {
            margin: 15px;
            background: linear-gradient(135deg, #1a1c23 0%, #0d1117 100%);
            border-radius: 12px;
            padding: 15px 20px;
            border-left: 4px solid var(--accent-cyan);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .promo-text h3 {
            font-size: 14px;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .promo-text p {
            font-size: 16px;
            font-weight: bold;
        }

        .promo-code {
            background: #242936;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px dashed #3f475a;
            font-size: 12px;
            color: var(--text-gray);
        }

        .promo-code strong {
            color: var(--text-white);
            letter-spacing: 0.5px;
        }

        /* Горизонтальный выбор спорта */
        .sports-nav {
            display: flex;
            gap: 10px;
            padding: 10px 15px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .sports-nav::-webkit-scrollbar {
            display: none; /* Прячем скроллбар */
        }

        .sport-btn {
            background: #1c202b;
            color: var(--text-gray);
            border: 1px solid #2c3243;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .sport-btn.active, .sport-btn:hover {
            background: var(--accent-cyan);
            color: #000;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(69, 243, 255, 0.3);
        }

        /* Сетка трансляций */
        .container {
            padding: 15px;
        }

        .section-title {
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #f0f0f0;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 18px;
            background-color: var(--accent-red);
            border-radius: 2px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1200px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* Карточка матча */
        .match-card {
            background: #161a24;
            border: 1px solid #222b38;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
        }

        .match-card:hover {
            border-color: #384556;
            transform: translateY(-2px);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 12px;
            color: #8b9bb4;
        }

        .league-badge {
            background: #222b38;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .live-indicator {
            color: var(--accent-red);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .live-indicator i {
            font-size: 8px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }

        .teams-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .team-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 600;
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .team-logo-placeholder {
            width: 24px;
            height: 24px;
            background: #2d3545;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #fff;
        }

        .score {
            font-size: 18px;
            color: var(--accent-cyan);
            font-family: monospace;
        }

        .match-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #222b38;
            padding-top: 12px;
        }

        .time-info {
            font-size: 13px;
            color: var(--text-gray);
        }

        .btn-watch {
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
            text-decoration: none;
        }

        .btn-watch:hover {
            background: #ff2a2b;
        }

        /* Блок Комментаторов */
        .commentators-section {
            background: #11141a;
            margin-top: 30px;
            padding: 25px 15px;
            border-top: 1px solid #222b38;
        }

        .comm-grid {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .comm-grid::-webkit-scrollbar {
            height: 4px;
        }

        .comm-grid::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        .comm-card {
            background: #161a24;
            border: 1px solid #222b38;
            border-radius: 10px;
            padding: 15px;
            min-width: 160px;
            text-align: center;
        }

        .comm-avatar {
            width: 55px;
            height: 55px;
            background: linear-gradient(45deg, var(--accent-red), var(--accent-cyan));
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
        }

        .comm-name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .comm-tag {
            font-size: 11px;
            color: var(--accent-cyan);
            background: rgba(69, 243, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="logo"><i class="fa-solid fa-play-circle"></i> SPORT<span>NEL</span></div>
        <div class="social-icons">
            <a href="#"><i class="fa-brands fa-telegram"></i></a>
