<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPORTNEL — Прямая трансляция NHL</title>
    <!-- Подключаем иконки FontAwesome (для соцсетей, шайбы и плеера) -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg-body: #080a10;
            --bg-card: #111522;
            --accent-nhl: #0070f3;
            --accent-live: #e50914;
            --text-main: #ffffff;
            --text-grey: #858fa3;
            --border-line: #1d2438;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            flex-grow: 1;
        }

        /* Красивая шапка со всеми нужными иконками соцсетей */
        header {
            background-color: var(--bg-card);
            border: 1px solid var(--border-line);
            padding: 16px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4);
        }

        .brand-block {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .brand span {
            color: var(--accent-nhl);
        }

        /* Кнопки соцсетей (TikTok, YouTube, Telegram) */
        .social-links {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .social-icon {
            color: var(--text-grey);
            font-size: 18px;
            text-decoration: none;
            transition: color 0.2s, transform 0.2s;
        }

        /* Эффект подсвечивания при наведении/нажатии */
        .social-icon.tg:hover { color: #24A1DE; transform: scale(1.1); }
        .social-icon.tt:hover { color: #ff007f; transform: scale(1.1); }
        .social-icon.yt:hover { color: #FF0000; transform: scale(1.1); }

        .player-wrapper {
            background-color: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 25px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6);
        }

        .video-ratio {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            background-color: #020305;
            border-radius: 10px;
        }

        .video-ratio iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-grey);
            gap: 12px;
            font-size: 13px;
            background: linear-gradient(135deg, #0d111f 0%, #05070d 100%);
            z-index: 10;
            text-align: center;
            padding: 20px;
            font-weight: 500;
        }

        .player-cover i {
            font-size: 52px;
            color: var(--accent-nhl);
        }

        .grid-header {
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-grey);
            margin: 0 0 12px 5px;
            letter-spacing: 1px;
        }

        .match-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .match-row {
            background-color: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .teams-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .teams-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
        }

        .match-status {
            font-size: 12px;
            color: var(--text-grey);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .match-status .live-dot {
            color: var(--accent-live);
            font-weight: 800;
            animation: blinker 1.5s linear infinite;
        }

        @keyframes blinker { 50% { opacity: 0; } }

        .btn-stream {
            background-color: var(--accent-live);
            color: var(--text-main);
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.3);
        }

        /* Стильный англоязычный футер с описанием сайта */
        footer {
            margin-top: 40px;
            padding: 20px 10px;
            text-align: center;
            border-top: 1px solid var(--border-line);
            width: 100%;
            max-width: 650px;
        }

        .footer-text {
            font-size: 13px;
            color: var(--text-grey);
            letter-spacing: 0.8px;
            font-weight: 600;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Шапка с логотипом и иконками соцсетей -->
        <header>
            <div class="brand-block">
                <div class="brand">SPORT<span>NEL</span></div>
            </div>
            <div class="social-links">
                <!-- Замени знак # внутри href="..." на ссылки на свои аккаунты, когда захочешь -->
                <a href="#" class="social-icon tg" title="Telegram" target="_blank"><i class="fa-brands fa-telegram"></i></a>
                <a href="#" class="social-icon tt" title="TikTok" target="_blank"><i class="fa-brands fa-tiktok"></i></a>
                <a href="#" class="social-icon yt" title="YouTube" target="_blank"><i class="fa-brands fa-youtube"></i></a>
            </div>
        </header>

        <!-- Модуль плеера -->
        <div class="player-wrapper">
            <div class="video-ratio">
                <div class="player-cover" id="screenCover">
                    <i class="fa-solid fa-circle-play"></i>
                    <p>Выберите интересующий матч из расписания ниже</p>
                </div>
                <iframe id="nhlStreamIframe" src="" allow="autoplay; fullscreen" allowfullscreen style="display:none;"></iframe>
            </div>
        </div>

        <div class="grid-header">МАТЧИ СЕГОДНЯ (ЛАТВИЙСКОЕ ВРЕМЯ)</div>
        
        <div class="match-list">
            <!-- Оставили только матч Vancouver - Florida -->
            <div class="match-row">
                <div class="teams-block">
                    <div class="teams-title">Vancouver — Florida</div>
                    <div class="match-status"><span class="live-dot">●</span> 00:00 · NHL Регулярный сезон</div>
                </div>
                <!-- Тестовая ссылка Mux, ночью поменяешь на реальный фрейм с OnHockey -->
                <button class="btn-stream" onclick="loadNhlStream('https://media-player.host')">Смотреть</button>
            </div>
        </div>
    </div>

    <!-- Футер с красивым описанием на английском языке -->
    <footer>
        <div class="footer-text">
            <i class="fa-solid fa-puck" style="color: var(--accent-nhl); margin-right: 5px;"></i> 
            The best website for watching NHL live streams
        </div>
    </footer>

    <script>
        function loadNhlStream(streamUrl) {
            const cover = document.getElementById('screenCover');
            const iframe = document.getElementById('nhlStreamIframe');
            
            if(streamUrl && streamUrl !== '#') {
                cover.style.display = 'none';
                iframe.style.display = 'block';
                iframe.src = streamUrl;
            }
        }
    </script>
</body>
</html>
