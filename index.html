<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPORTNEL</title>
<style>
:root {--bg-body:#05070c;--bg-card:#0e111a;--accent-nhl:#0070f3;--accent-live:#e50914;--text-main:#ffffff;--text-grey:#858fa3;--border-line:#1a1f2c;}
* {box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
body {background-color:var(--bg-body);color:var(--text-main);padding:15px;display:flex;flex-direction:column;align-items:center;min-height:100vh;}
.container {width:100%;max-width:650px;flex-grow:1;}
header {background-color:var(--bg-card);border:1px solid var(--border-line);border-bottom:2px solid var(--accent-nhl);padding:16px 20px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.brand {font-size:20px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;}
.brand span {color:var(--accent-nhl);}
.social-links {display:flex;align-items:center;gap:18px;}
.social-icon {display:flex;align-items:center;justify-content:center;text-decoration:none;}
.social-icon svg {width:24px;height:24px;display:block;}
.player-wrapper {background-color:var(--bg-card);border:1px solid var(--border-line);border-radius:18px;padding:12px;margin-bottom:25px;position:relative;box-shadow:0 0 20px rgba(0,112,243,0.15);animation:neonBorder 6s linear infinite;}
@keyframes neonBorder {0%,100% {border-color:var(--accent-nhl);box-shadow:0 0 25px rgba(0,112,243,0.25);} 50% {border-color:var(--accent-live);box-shadow:0 0 25px rgba(229,9,20,0.25);}}
.video-ratio {position:relative;padding-bottom:56.25%;height:0;overflow:hidden;background-color:#010204;border-radius:12px;}
.video-ratio iframe {position:absolute;top:0;left:0;width:100%;height:100%;border:none;z-index:5;}
.player-cover {position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;overflow:hidden;background:linear-gradient(135deg,#0b0e1a 0%,#030408 100%);}
.slide-stage {width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center;}
.player-slide {position:absolute;width:100%;height:100%;opacity:0;display:flex;align-items:center;justify-content:space-between;padding:10px 30px;transition:opacity 0.8s ease-in-out;}
.player-slide.active {opacity:1;}
.nhl-player-photo {height:115%;object-fit:contain;align-self:flex-end;margin-bottom:-10px;}
.nhl-team-logo {width:110px;height:110px;object-fit:contain;}
.slide-center-info {display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;flex-grow:1;}
.slide-center-info svg {width:42px;height:42px;fill:var(--accent-nhl);}
.slide-center-info p {font-size:12px;color:var(--text-grey);font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.grid-header {font-size:12px;font-weight:800;text-transform:uppercase;color:var(--text-grey);margin:0 0 12px 5px;letter-spacing:1.5px;}
.match-list {display:flex;flex-direction:column;gap:12px;}
.match-row {background-color:var(--bg-card);border:1px solid var(--border-line);border-bottom:3px solid var(--accent-nhl);border-radius:16px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;}
.teams-block {display:flex;flex-direction:column;gap:8px;}
.team-item {display:flex;align-items:center;gap:12px;}
.team-logo-svg {width:24px;height:24px;display:block;}
.teams-title {font-size:16px;font-weight:700;color:var(--text-main);letter-spacing:0.3px;}
.match-status {font-size:12px;color:var(--text-grey);display:flex;align-items:center;gap:6px;margin-top:2px;font-weight:500;}
.match-status .live-dot {color:var(--accent-live);font-weight:900;animation:blinker 1.5s linear infinite;}
@keyframes blinker {50% {opacity:0;}}
.btn-stream {background:linear-gradient(135deg,var(--accent-live) 0%,#b8070f 100%);color:var(--text-main);border:none;padding:11px 22px;border-radius:10px;font-size:11px;font-weight:800;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 15px rgba(229,9,20,0.4);}
footer {margin-top:auto;padding:25px 10px;text-align:center;border-top:1px solid var(--border-line);width:100%;max-width:650px;}
.footer-text {font-size:12px;letter-spacing:1px;font-weight:700;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px;}
.footer-text svg {width:16px;height:16px;fill:#45f3ff;animation:spinPuck 4s linear infinite;}
.neon-blue {color:#45f3ff;text-shadow:0 0 10px rgba(69,243,255,0.8);}
.neon-red {color:#ff2a3b;text-shadow:0 0 10px rgba(255,42,59,0.8);}
@keyframes spinPuck {100% {transform:rotate(360deg);}}
</style>
</head>

<script>
function loadNhlStream(streamUrl){const cover=document.getElementById('screenCover');const iframe=document.getElementById('nhlStreamIframe');if(streamUrl&&streamUrl!=='#'){cover.style.display='none';iframe.style.display='block';iframe.src=streamUrl;}}const slides=document.querySelectorAll('.player-slide');let currentSlide=0;setInterval(()=>{slides[currentSlide].classList.remove('active');currentSlide=(currentSlide+1)%slides.length;slides[currentSlide].classList.add('active');},3000);
</script>
