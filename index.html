<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Современный Плеер Трансляций</title>
    <style>
        /* Общие стили для красивого внешнего вида */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #141414;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Контейнер для ввода ссылки */
        .controls {
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 6px;
            background-color: #222;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #ff0000;
        }

        button {
            padding: 12px 24px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #cc0000;
        }

        /* 📱 Адаптивный контейнер для видео (соотношение сторон 16:9) */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            padding-bottom: 56.25%; /* Соотношение 16:9 */
            height: 0;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Сам плеер растягивается на весь контейнер */
        .video-container iframe, 
        .video-container div {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>Трансляция Видео из YouTube</h1>

    <div class="controls">
        <input type="text" id="videoUrl" placeholder="Вставьте ссылку на видео или трансляцию YouTube...">
        <button onclick="loadVideo()">Запустить</button>
    </div>

    <!-- Контейнер, куда скрипт вставит плеер -->
    <div class="video-container">
        <div id="player"></div>
    </div>

    <script>
        // Подключаем официальное API YouTube
        var tag = document.createElement('script');
        tag.src = "https://youtube.com";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        
        // Видео по умолчанию (можно заменить на ID вашей трансляции)
        var defaultVideoId = 'dQw4w9WgXcQ'; 

        // Эта функция вызывается автоматически, когда API готово
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: defaultVideoId,
                playerVars: {
                    'autoplay': 1,        // Автоматический старт (может блокироваться браузерами без приглушения звука)
                    'controls': 1,        // Показывать стандартные элементы управления
                    'rel': 0,             // Не показывать похожие видео в конце
                    'showinfo': 0,        // Скрывать название видео перед стартом
                    'modestbranding': 1   // Меньше логотипов YouTube
                }
            });
        }

        // Функция для извлечения ID видео из любой ссылки YouTube
        function getYouTubeId(url) {
            var regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            var match = url.match(regExp);
            return (match && match[2].length == 11) ? match[2] : null;
        }

        // Функция смены видео
        function loadVideo() {
            var urlInput = document.getElementById('videoUrl').value;
            if (!urlInput) {
                alert('Пожалуйста, вставьте ссылку!');
                return;
            }

            var videoId = getYouTubeId(urlInput);

            if (videoId) {
                // Если плеер уже создан, просто меняем видео
                if (player && typeof player.loadVideoById === 'function') {
                    player.loadVideoById(videoId);
                }
            } else {
                alert('Не удалось распознать ссылку. Убедитесь, что это правильная ссылка на YouTube.');
            }
        }
    </script>

</body>
</html>
