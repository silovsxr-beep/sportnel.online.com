<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPORTNEL — Прямые трансляции NHL</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg-dark: #0d0e12;
            --bg-card: #161920;
            --accent-red: #e50914;
            --text-white: #ffffff;
            --text-muted: #8a8d98;
            --border-color: #22252f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            padding: 15px;
        }

        header {
            background-color: var(--bg-card);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .logo {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .logo span {
            color: var(--accent-red);
        }

        .live-badge {
            background-color: rgba(229, 9, 20, 0.1);
            color: var(--accent-red);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stream-container {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .video-player {
            position: relative;
            padding-bottom: 56.25%; /* Соотношение сторон 16:9 */
            height: 0;
            overflow: hidden;
            background-color: #000;
            border-radius: 6px;
        }

        /* Адаптивный стандартный HTML5 плеер */
        .video-player video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
        }

        .player-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            gap: 10px;
            font-size: 14px;
            background-color: #050608;
            z-index: 2;
        }

        .player-placeholder i {
            font-size: 40px;
            color: var(--accent-red);
        }

        .match-list-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 20px 0 10px 5px;
            letter-spacing: 0.5px;
        }

        .match-row {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .match-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .teams {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-white);
        }

        .meta {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .meta span.live {
            color: var(--accent-red);
            font-weight: 700;
        }

        .watch-btn {
            background-color: var(--accent-red);
            color: var(--text-white);
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
        }

        .watch-btn.waiting {
            background-color: #222530;
            border: 1px solid #2d3140;
            color: var(--text-muted);
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- Название вашего сайта -->
    <header>
        <div class="logo">SPORT<span>NEL</span></div>
        <div class="live-badge"><i class="fa-solid fa-circle-dot"></i> Эфир NHL</div>
    </header>

    <div class="stream-container">
        <div class="video-player">
            <div class="player-placeholder" id="playerScreen">
                <i class="fa-solid fa-circle-play"></i>
                <p>Выберите активный матч ниже для начала трансляции</p>
            </div>
            <!-- Стандартный видео тег, работающий на всех смартфонах -->
            <video id="mainVideoPlayer" controls playsinline style="display:none;"></video>
        </div>
    </div>

    <div class="match-list-title">Расписание трансляций</div>

    <div class="match-row">
        <div class="match-info">
            <div class="teams">Вашингтон — Монреаль</div>
            <div class="meta"><span class="live">● LIVE</span> · Регулярный чемпионат</div>
        </div>
        <!-- Прямая ссылка на надежное тестовое видео (MP4) без блокировок и капчи -->
        <button class="watch-btn" onclick="startStream('https://zencdn.net')">Смотреть</button>
    </div>

    <div class="match-row">
        <div class="match-info">
            <div class="teams">Колорадо — Даллас</div>
            <div class="meta">Сегодня, 03:30 · Регулярный чемпионат</div>
        </div>
        <button class="watch-btn waiting" onclick="alert('Матч еще не начался!')">Обзор</button>
    </div>

    <script>
        function startStream(url) {
            const placeholder = document.getElementById('playerScreen');
            const video = document.getElementById('mainVideoPlayer');
            
            if(url) {
                placeholder.style.display = 'none';
                video.style.display = 'block'; // Исправлена опечатка в отображении плеера
                video.src = url;
                video.play().catch(function(error) {
                    console.log("Автовоспроизведение заблокировано браузером, пользователь должен нажать Play вручную.");
                });
            }
        }
    </script>
</body>
</html>
